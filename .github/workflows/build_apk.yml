name: Build SysPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Missing Platform Wrapper Files Safely
        run: flutter create --org com.syspulse --project-name mobile_syspulse .

      - name: Setup Android Gradle Config
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.syspulse.mobile"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.syspulse.mobile"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildFeatures {
                  resValues true
                  buildConfig true
              }

              flavorDimensions "store"

              productFlavors {
                  google {
                      dimension "store"
                      resValue "string", "app_name", "SysPulse"
                      buildConfigField "String", "STORE_FLAVOR", '"google"'
                      buildConfigField "String", "MOBILE_SERVICES", '"GMS"'
                  }
                  huawei {
                      dimension "store"
                      applicationIdSuffix ".huawei"
                      versionNameSuffix "-hms"
                      resValue "string", "app_name", "SysPulse"
                      buildConfigField "String", "STORE_FLAVOR", '"huawei"'
                      buildConfigField "String", "MOBILE_SERVICES", '"HMS"'
                  }
                  samsung {
                      dimension "store"
                      versionNameSuffix "-galaxy"
                      resValue "string", "app_name", "SysPulse"
                      buildConfigField "String", "STORE_FLAVOR", '"samsung"'
                      buildConfigField "String", "MOBILE_SERVICES", '"GMS"'
                  }
                  standalone {
                      dimension "store"
                      versionNameSuffix "-direct"
                      resValue "string", "app_name", "SysPulse Pro"
                      buildConfigField "String", "STORE_FLAVOR", '"standalone"'
                      buildConfigField "String", "MOBILE_SERVICES", '"INDEPENDENT"'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --flavor standalone -t lib/main_standalone.dart --release

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: SysPulse-Android-APK
          path: build/app/outputs/flutter-apk/app-standalone-release.apk
