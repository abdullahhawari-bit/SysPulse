name: Build SysPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Missing Platform Wrapper Files Safely
        run: flutter create --org com.syspulse --project-name mobile_syspulse .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --flavor standalone -t lib/main_standalone.dart --release

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: SysPulse-Android-APK
          path: build/app/outputs/flutter-apk/app-standalone-release.apk
